<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Pinterest">
 <defs>
  <radialGradient id="bg" cx="35%" cy="25%" r="90%"><stop stop-color="#383838"/><stop offset="1" stop-color="#090909"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="screen"><rect x="8" y="8" width="112" height="112" rx="9"/></clipPath>
 </defs>
 <rect x="3" y="3" width="122" height="122" rx="13" fill="url(#bg)" stroke="#d5d5d5" stroke-opacity=".5" stroke-width="2"/>
 <circle cx="64" cy="64" r="43" fill="none" stroke="#ddd" stroke-opacity=".3" stroke-width="1.5"><animate attributeName="r" values="40;44;40" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".2;.5;.2" dur="3s" repeatCount="indefinite"/></circle>
 <text x="64" y="83" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="bold" fill="#f1f1f1" filter="url(#glow)">P<animate attributeName="opacity" values=".8;1;.8" dur="3s" repeatCount="indefinite"/></text>
 <g clip-path="url(#screen)" pointer-events="none">
  <text x="64" y="83" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="bold" fill="#fff" opacity="0" filter="url(#glow)">P
   <animate attributeName="opacity" values="0;0;1;0;0;.95;0;0" keyTimes="0;.08;.1;.14;.18;.2;.24;1" dur="2.4s" begin=".6s" repeatCount="indefinite"/>
   <animateTransform attributeName="transform" type="translate" values="0 0;0 0;9 -2;0 0;-8 2;0 0;0 0;0 0" keyTimes="0;.08;.1;.14;.18;.2;.24;1" dur="2.4s" begin=".6s" repeatCount="indefinite"/>
  </text>
  <rect x="-40" y="41" width="82" height="3" fill="#fff" opacity="0"><animate attributeName="x" values="-40;20;128;128" keyTimes="0;.1;.2;1" dur="2.4s" begin=".6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.1;.2;1" dur="2.4s" begin=".6s" repeatCount="indefinite"/></rect>
  <rect x="-50" y="78" width="100" height="2" fill="#eee" opacity="0"><animate attributeName="x" values="-50;15;128;128" keyTimes="0;.12;.22;1" dur="2.4s" begin=".6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0;0" keyTimes="0;.12;.22;1" dur="2.4s" begin=".6s" repeatCount="indefinite"/></rect>
  <rect x="8" y="57" width="112" height="8" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0;.55;0;0;0;0" keyTimes="0;.08;.1;.13;.17; .2;1" dur="2.4s" begin=".6s" repeatCount="indefinite"/></rect>
 </g>
</svg>
